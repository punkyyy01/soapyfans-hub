<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SoapyFans Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080704"/>
      <stop offset="45%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#1d130c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#3e2a18" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1c130b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#080704" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="0.85" cy="0.85" r="0.55">
      <stop offset="0%" stop-color="#2e1f14" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#080704" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5d799"/>
      <stop offset="50%" stop-color="#e2b45d"/>
      <stop offset="100%" stop-color="#b87d1f"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8890c"/>
      <stop offset="100%" stop-color="#ffb700"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" opacity="0.035"/>
      <circle cx="4.5" cy="2" r="0.5" fill="#ffffff" opacity="0.03"/>
      <circle cx="3" cy="5" r="0.4" fill="#ffffff" opacity="0.025"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#bottomGlow)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>

  <!-- Elegant Editorial Frame -->
  <rect x="54" y="54" width="1092" height="522" rx="24" fill="none" stroke="#382617" stroke-width="1.5"/>
  <rect x="70" y="70" width="1060" height="490" rx="16" fill="none" stroke="#22160d" stroke-width="1"/>

  <!-- Top Metadata Row -->
  <g>
    <text x="108" y="136" fill="#9d8870" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" letter-spacing="5">
      SOAPYHUB.FANS
    </text>
    <rect x="894" y="115" width="198" height="30" rx="15" fill="#15100b" stroke="#382617" stroke-width="1"/>
    <circle cx="914" cy="130" r="3.5" fill="#e8890c"/>
    <text x="928" y="135" fill="#cfbfa9" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2.5">
      FAN ARCHIVE
    </text>
  </g>

  <!-- Main Headline Typography -->
  <g>
    <text x="108" y="260" fill="#f5f0e8" font-family="'Playfair Display', serif" font-size="76" font-weight="600" letter-spacing="-0.5">
      SoapyFans
    </text>
    <text x="500" y="260" fill="url(#gold)" font-family="'Playfair Display', serif" font-size="76" font-weight="600" font-style="italic" letter-spacing="-0.5">
      Hub
    </text>
  </g>

  <!-- Divider Line -->
  <rect x="108" y="290" width="280" height="4" rx="2" fill="url(#amberAccent)"/>

  <!-- Tagline / Descriptor -->
  <text x="108" y="348" fill="#e0d2bf" font-family="'DM Sans', sans-serif" font-size="24" font-weight="400" letter-spacing="3.5">
    A LUMINOUS SOPHIE THATCHER ARCHIVE
  </text>
  <text x="108" y="384" fill="#9d8870" font-family="'DM Sans', sans-serif" font-size="16" font-weight="400" letter-spacing="1">
    Filmography, television credits, music releases, and fan reviews.
  </text>

  <!-- Bottom Navigation Capsule -->
  <g>
    <rect x="108" y="460" width="984" height="52" rx="14" fill="#120d09" stroke="#2e1f13" stroke-width="1"/>
    <text x="136" y="492" fill="#bda98a" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" letter-spacing="3.5">
      FILMS  ·  TELEVISION  ·  ORIGINAL MUSIC  ·  REVIEWS  ·  NEWS
    </text>
  </g>
</svg>